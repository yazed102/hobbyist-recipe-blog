<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hobbyist Recipe Blog | Submit Recipe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">

      <a class="navbar-brand fw-bold" href="index.html">
        Hobbyist Recipe Blog
      </a>

    
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNav"
        aria-controls="mainNav"
        aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

    
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">

          <li class="nav-item">
            <a class="nav-link" href="index.html">
              Home
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="recipes.html">
              Recipes
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="recipe-detail.html">
              Recipe Detail
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="submit.html">
              Submit Recipe
            </a>
          </li>

        </ul>
      </div>

    </div>
  </nav>
</header>


<main class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <h1 class="mb-2">Submit a New Recipe</h1>
        <p class="text-secondary mb-4">Share your favorite recipe with the community.</p>

        <form class="card shadow-sm p-4">
          <div class="mb-3">
            <label for="recipeName" class="form-label">Recipe Name</label>
            <input type="text" class="form-control" id="recipeName" required>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="chef" class="form-label">Chef Name</label>
              <input type="text" class="form-control" id="chef" required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="prepTime" class="form-label">Prep Time</label>
              <input type="number" class="form-control" id="prepTime" min="1" required>
            </div>
          </div>

          <div class="mb-3">
            <label for="category" class="form-label">Category</label>
            <select class="form-select" id="category" required>
              <option value="">Choose...</option>
              <option>Breakfast</option>
              <option>Lunch</option>
              <option>Dinner</option>
              <option>Dessert</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="ingredients" class="form-label">Ingredients</label>
            <textarea class="form-control" id="ingredients" rows="5" placeholder="List each ingredient on a new line" required></textarea>
          </div>

          <div class="mb-3">
            <label for="instructions" class="form-label">Instructions</label>
            <textarea class="form-control" id="instructions" rows="6" required></textarea>
          </div>

          <div class="mb-4">
            <label for="image" class="form-label">Recipe Image</label>
            <input type="file" class="form-control" id="image" accept="image/*">
          </div>

          <button type="submit" class="btn btn-dark btn-lg">Submit Recipe</button>
        </form>
      </div>
    </div>
  </div>
</main>

<footer class="bg-dark text-white text-center py-4">
  <p class="mb-0">&copy; 2026 Hobbyist Recipe Blog</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
